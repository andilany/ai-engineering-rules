name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Verify tag is the current main commit
        run: |
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Release tag must point to the current main commit."
            echo "tag:  $GITHUB_SHA"
            echo "main: $MAIN_SHA"
            exit 1
          fi

      - name: Install project and development dependencies
        run: uv sync --group dev

      - name: Validate release metadata
        run: >-
          uv run python scripts/check_release.py
          --tag "$GITHUB_REF_NAME"
          --notes-output "$RUNNER_TEMP/release-notes.md"

      - name: Run tests
        run: uv run pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q src

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test built wheel
        run: uv run --isolated --no-project --with dist/*.whl airules version

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
